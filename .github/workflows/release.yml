name: package addon

on:
  release:
    types: [published]

jobs:
  zip-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: vimtor/action-zip@v1.3
        with:
          files: *.py
          dest: LSExporter.zip

    publish:
      uses: softprops/action-gh-release@v2
      with:
        files: LSExporter.zip
        generate_release_notes: true
